[pytest]
testpaths = tests
norecursedirs = .git .pytest_cache outputs work frontend node_modules
filterwarnings =
    ignore:'click.utils.get_binary_stream' is deprecated.*:DeprecationWarning
    ignore:'click.utils.get_text_stream' is deprecated.*:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning
